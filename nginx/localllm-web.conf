server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 5.129.234.9 _;

    client_max_body_size 64k;

    # Страница чата + API (web.py на :8000)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API чата: rate limit + длинный таймаут (LLM отвечает медленно на 2 ядрах)
    location /api/ {
        limit_req zone=localllm_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 900s;   # под параллельной нагрузкой очередь может ждать минуты
        proxy_send_timeout 900s;
    }
}
